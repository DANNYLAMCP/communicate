<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>關卡音效網頁遊戲控制台</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #4f46e5;
      --accent-hover: #4338ca;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --text-color: #f3f4f6;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid #2d2d38;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      background-color: #2b2b36;
      font-size: 0.9rem;
      margin-bottom: 20px;
      color: #a1a1aa;
    }

    .mechanism-section {
      margin: 25px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .lamp-label {
      font-size: 0.85rem;
      color: #a1a1aa;
    }

    .lamp {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #33333f;
      border: 3px solid #444454;
      transition: all 0.1s ease;
    }

    .lamp.active {
      background-color: #facc15;
      border-color: #fde047;
      box-shadow: 0 0 25px #facc15, inset 0 0 10px #ffffff;
    }

    .shake-box {
      transition: transform 0.1s;
    }

    .shake {
      animation: shakeAndFlash 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shakeAndFlash {
      10%, 90% { transform: translate3d(-2px, 0, 0); background-color: #3f1d1d; }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button.danger-btn {
      background-color: var(--danger-color);
    }
    button.danger-btn:hover {
      background-color: #dc2626;
    }

    button.warning-btn {
      background-color: var(--warning-color);
      color: #18181b;
    }
    button.warning-btn:hover {
      background-color: #d97706;
    }

    .audio-controls {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #2d2d38;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-grow: 1;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-color);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-card shake-box" id="gameCard">
    <h2>關卡音效控制台</h2>
    <div class="status-badge" id="status">準備就緒，點擊下方按鈕測試</div>

    <div class="mechanism-section">
      <div class="lamp-label">機制 4 警示燈號</div>
      <div class="lamp" id="lamp4"></div>
    </div>

    <div class="button-group">
      <button onclick="enterLevel()">▶ 進入關卡 (啟動 BGM)</button>
      <button class="danger-btn" onclick="triggerExplosion()">💥 觸發爆炸音效</button>
      <button class="warning-btn" onclick="triggerMechanism4()">💡 觸發機制 4 閃燈音效</button>
      <button style="background-color: #4b5563;" onclick="exitLevel()">⏹ 離開關卡 (停止 BGM)</button>
    </div>

    <div class="audio-controls">
      <button style="padding: 6px 12px; font-size: 0.85rem;" onclick="toggleMute()" id="muteBtn">靜音</button>
      <div class="slider-container">
        <span style="font-size: 0.8rem; color: #a1a1aa;">音量</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)">
      </div>
    </div>
  </div>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.bgmGain = null;
        this.sfxGain = null;
        this.bgmInterval = null;
        this.isPlayingBGM = false;
        this.isMuted = false;
        this.lastVolume = 0.5;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0.5, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);

          this.bgmGain = this.ctx.createGain();
          this.bgmGain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          this.bgmGain.connect(this.masterGain);

          this.sfxGain = this.ctx.createGain();
          this.sfxGain.gain.setValueAtTime(1.0, this.ctx.currentTime);
          this.sfxGain.connect(this.masterGain);
        }

        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startBGM() {
        this.init();
        if (this.isPlayingBGM) return;
        this.isPlayingBGM = true;

        const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        let noteIndex = 0;

        this.bgmInterval = setInterval(() => {
          if (!this.isPlayingBGM) return;

          const osc = this.ctx.createOscillator();
          const noteGain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(melody[noteIndex % melody.length], this.ctx.currentTime);

          noteGain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          noteGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);

          osc.connect(noteGain);
          noteGain.connect(this.bgmGain);

          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);

          noteIndex++;
        }, 280);
      }

      stopBGM() {
        this.isPlayingBGM = false;
        if (this.bgmInterval) {
          clearInterval(this.bgmInterval);
        }
      }

      playExplosionSound() {
        this.init();

        const duration = 0.5;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + duration);

        const expGain = this.ctx.createGain();
        expGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
        expGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(expGain);
        expGain.connect(this.sfxGain);

        noise.start();
      }

      playBlinkSound() {
        this.init();

        const osc = this.ctx.createOscillator();
        const noteGain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, this.ctx.currentTime + 0.12);

        noteGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        noteGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

        osc.connect(noteGain);
        noteGain.connect(this.sfxGain);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      }

      setVolume(val) {
        this.init();
        this.masterGain.gain.setValueAtTime(val, this.ctx.currentTime);
      }
    }

    const sound = new SoundEngine();

    function enterLevel() {
      sound.startBGM();
      document.getElementById('status').innerText = "🔊 進入關卡：BGM 播放中";
    }

    function triggerExplosion() {
      sound.playExplosionSound();
      const card = document.getElementById('gameCard');
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 350);
    }

    function triggerMechanism4() {
      sound.playBlinkSound();
      const lamp = document.getElementById('lamp4');
      lamp.classList.add('active');
      setTimeout(() => lamp.classList.remove('active'), 180);
    }

    function exitLevel() {
      sound.stopBGM();
      document.getElementById('status').innerText = "⏸ 已離開關卡：BGM 停止";
    }

    function changeVolume(val) {
      sound.setVolume(val);
      if (val > 0 && sound.isMuted) {
        sound.isMuted = false;
        document.getElementById('muteBtn').innerText = "靜音";
      }
    }

    function toggleMute() {
      const slider = document.getElementById('volumeSlider');
      const muteBtn = document.getElementById('muteBtn');

      if (sound.isMuted) {
        sound.isMuted = false;
        slider.value = sound.lastVolume;
        sound.setVolume(sound.lastVolume);
        muteBtn.innerText = "靜音";
      } else {
        sound.lastVolume = slider.value;
        sound.isMuted = true;
        slider.value = 0;
        sound.setVolume(0);
        muteBtn.innerText = "取消靜音";
      }
    }
  </script>
</body>
</html>
